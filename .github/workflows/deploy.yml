# Builds the static export and publishes it to GitHub Pages.
#
# Requires Settings → Pages → Source = "GitHub Actions". Leaving it on the
# default "Deploy from a branch" makes Pages run Jekyll instead, which ignores
# this workflow entirely and serves README.md as the homepage.
#
# The site is served from the root of mealfind.co.uk (Settings → Pages → Custom
# domain, kept in sync by `public/CNAME`). That means the build must NOT be
# given a base path or a github.io site URL — see the note below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead. `cancel-in-progress: false` so a
# deploy that is already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Kept only to ensure Pages is enabled for the repo.
      #
      # ⚠️ Do not feed this step's `base_path` / `base_url` outputs into the
      # build. They describe the repository's *project site*
      # (`/MealFind-Website`, `https://peanut1945.github.io/MealFind-Website`)
      # and keep doing so after a custom domain is attached. Passing them to
      # Next bakes `/MealFind-Website/...` into every asset URL, which 404s at
      # the domain root and serves the site with no CSS and no images. The
      # custom domain is the root, so the build needs no prefix at all.
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # No NEXT_PUBLIC_BASE_PATH: assets stay root-relative (`/_next/...`).
      # No NEXT_PUBLIC_SITE_URL either — the canonical origin lives in
      # `src/lib/site.ts` so it can't drift from what the build actually uses.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
